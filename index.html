<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Werewolf: Ultimate Edition</title>
  <style>
    :root {
      --bg: #090d16;
      --surface: #131926;
      --surface-2: #1f293d;
      --surface-3: #2d3b57;
      --text: #f8fafc;
      --muted: #94a3b8;
      --wolf: #ef4444;
      --village: #3b82f6;
      --solo: #f59e0b;
      --special: #8b5cf6;
      --safe: #10b981;
      --border: #334155;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding: 1rem;
      line-height: 1.4;
    }

    .container { max-width: 580px; margin: 0 auto; }
    .screen { display: none; }
    .screen.active { display: block; }

    h1, h2, h3 { text-align: center; margin-bottom: 0.75rem; }

    .tabs {
      display: flex;
      gap: 0.35rem;
      margin-bottom: 1rem;
      background: var(--surface);
      padding: 0.25rem;
      border-radius: 10px;
    }

    .tab-btn {
      flex: 1;
      padding: 0.6rem 0.2rem;
      border: none;
      background: transparent;
      color: var(--muted);
      border-radius: 8px;
      font-weight: 600;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .tab-btn.active {
      background: var(--surface-2);
      color: var(--text);
    }

    .tab-content { display: none; }
    .tab-content.active { display: block; }

    .card {
      background: var(--surface);
      border-radius: 12px;
      padding: 1rem;
      margin-bottom: 1rem;
      border: 1px solid var(--border);
    }

    input, button, select {
      font: inherit;
      width: 100%;
      padding: 0.7rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-2);
      color: var(--text);
      margin-bottom: 0.5rem;
    }

    button {
      background: var(--village);
      border: none;
      cursor: pointer;
      font-weight: 600;
      transition: opacity 0.15s;
    }

    button:hover { opacity: 0.9; }
    button.secondary { background: var(--surface-2); border: 1px solid var(--border); }
    button.danger { background: var(--wolf); color: #fff; }
    button.success { background: var(--safe); color: #000; }
    button.warning { background: var(--solo); color: #000; }
    button.purple { background: var(--special); color: #fff; }
    button:disabled { opacity: 0.4; cursor: not-allowed; }

    .toggle-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.6rem 0;
      border-bottom: 1px solid var(--surface-2);
    }

    .toggle-row:last-child { border-bottom: none; }
    .toggle-row input[type="checkbox"] { width: 1.3rem; height: 1.3rem; accent-color: var(--village); margin: 0; cursor: pointer; }

    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0.5rem; }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 0.5rem;
      max-height: 380px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .role-card {
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.8rem;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
    }

    .role-card.team-wolf { border-color: var(--wolf); }
    .role-card.team-solo { border-color: var(--solo); }
    .role-card.team-village { border-color: var(--village); }

    .role-badge {
      display: inline-block;
      padding: 0.2rem 0.45rem;
      border-radius: 999px;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .badge-wolf { background: var(--wolf); color: #fff; }
    .badge-village { background: var(--village); color: #fff; }
    .badge-solo { background: var(--solo); color: #000; }

    .player-list { list-style: none; }
    .player-list li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.4rem 0;
      border-bottom: 1px solid var(--surface-2);
    }

    .center { text-align: center; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .big { font-size: 1.25rem; font-weight: 700; }

    .log {
      font-family: ui-monospace, monospace;
      font-size: 0.8rem;
      color: var(--muted);
      max-height: 160px;
      overflow-y: auto;
      white-space: pre-wrap;
    }

    /* Modal */
    .modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.8);
      align-items: center;
      justify-content: center;
      padding: 1rem;
      z-index: 100;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      max-width: 440px;
      width: 100%;
      padding: 1.5rem;
    }

    .role-action-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.4rem;
      margin-top: 0.4rem;
    }

    .role-toggle-btn {
      flex: 1;
      padding: 0.35rem 0.2rem;
      font-size: 0.75rem;
      margin: 0;
      border-radius: 6px;
      background: var(--surface-3);
      color: var(--muted);
      cursor: pointer;
    }

    .role-toggle-btn.active {
      background: var(--safe);
      color: #000;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="container">

    <!-- SETUP SCREEN -->
    <div id="setup" class="screen active">
      <h1>Werewolf: Ultimate</h1>

      <div class="tabs">
        <button class="tab-btn active" data-tab="tab-players">Players (<span id="playerCount">0</span>)</button>
        <button class="tab-btn" data-tab="tab-roles">Roles</button>
        <button class="tab-btn" data-tab="tab-settings">Settings</button>
      </div>

      <!-- Tab: Players -->
      <div id="tab-players" class="tab-content active">
        <div class="card">
          <h3>Add Players</h3>
          <input type="text" id="playerName" placeholder="Enter player name" maxlength="20" autocomplete="off">
          <button id="addPlayerBtn">Add Player</button>
          <ul id="playersList" class="player-list"></ul>
        </div>
      </div>

      <!-- Tab: Roles -->
      <div id="tab-roles" class="tab-content">
        <div class="card">
          <h3>Role Allocation Mode</h3>
          <select id="assignmentMode">
            <option value="selected_random">Mode 2: Random from Enabled Roles (Toggles)</option>
            <option value="full_random">Mode 1: Full Random (All 40 Roles Pool)</option>
            <option value="custom">Manual / Fixed Counts</option>
          </select>
          <p id="modeDesc" class="muted">Toggle which roles are allowed. The game randomly determines if they appear and how many appear.</p>
        </div>

        <div class="card">
          <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:0.5rem;">
            <h3 style="margin:0;">Roles Setup</h3>
            <div id="quickToggles" style="display:flex; gap:0.25rem;">
              <button class="secondary" style="width:auto; padding:0.2rem 0.5rem; font-size:0.75rem; margin:0;" onclick="toggleAllRoles(true)">Enable All</button>
              <button class="secondary" style="width:auto; padding:0.2rem 0.5rem; font-size:0.75rem; margin:0;" onclick="toggleAllRoles(false)">Disable All</button>
            </div>
          </div>
          <div id="roleGrid" class="role-grid"></div>
        </div>
      </div>

      <!-- Tab: Settings -->
      <div id="tab-settings" class="tab-content">
        <div class="card">
          <h3>Game Rules</h3>
          <div class="toggle-row">
            <label for="firstNightImmunity">
              <strong>First Night Kill Protection</strong><br>
              <span class="muted">Werewolves cannot eliminate on Night 1</span>
            </label>
            <input type="checkbox" id="firstNightImmunity" checked>
          </div>
          <div class="toggle-row">
            <label for="hideVoteCounts">
              <strong>Hide Live Vote Numbers</strong><br>
              <span class="muted">Conceal running vote tallies during day voting</span>
            </label>
            <input type="checkbox" id="hideVoteCounts" checked>
          </div>
        </div>

        <div class="card">
          <h3>Timers & Audio</h3>
          <label class="muted">Day discussion timer (seconds, 0 = off)</label>
          <input type="number" id="dayTimer" value="180" min="0">
        </div>
      </div>

      <button id="startBtn" class="success" disabled>Start Game</button>
    </div>

    <!-- REVEAL SCREEN -->
    <div id="reveal" class="screen">
      <h1>Secret Roles</h1>
      <p class="center muted" style="margin-bottom: 0.75rem;">Pass device to each player</p>
      <div class="card">
        <div id="revealGrid" class="grid-2"></div>
      </div>
      <button id="beginNightBtn" class="purple">Everyone Knows Role — Begin Night 1</button>
    </div>

    <!-- GAMEPLAY SCREEN -->
    <div id="game" class="screen">
      <div class="card center" style="margin-bottom:0.5rem; padding:0.6rem;">
        <span id="phaseIndicator" class="big"></span>
      </div>
      <div id="gameContent" class="card"></div>
      <div class="card log" id="gameLog"></div>
    </div>

    <!-- GAME OVER SCREEN -->
    <div id="end" class="screen">
      <h1>Game Over</h1>
      <div class="card center">
        <div class="big" id="winnerText" style="margin-bottom: 1rem;"></div>
        <div id="finalRoles"></div>
        <button id="newGameBtn" class="purple" style="margin-top:1rem;">New Game</button>
      </div>
    </div>

    <!-- ROLE INFO MODAL -->
    <div id="infoModal" class="modal">
      <div class="modal-content">
        <h2 id="modalRoleName"></h2>
        <span id="modalTeamBadge" class="role-badge" style="margin-bottom:0.75rem;"></span>
        <p id="modalRoleDesc" style="margin: 0.75rem 0; line-height: 1.5;"></p>
        <button id="modalCloseBtn" class="secondary">Close</button>
      </div>
    </div>

  </div>

  <script>
    const ROLES = {
      // VILLAGE ALIGNED
      villager: { name: 'Villager', team: 'village', stackable: true, desc: 'Standard villager with no special night abilities.' },
      seer: { name: 'Seer', team: 'village', stackable: false, desc: 'Each night, investigate a player to see if they are a Werewolf.' },
      doctor: { name: 'Doctor', team: 'village', stackable: false, desc: 'Each night, protect a player from werewolf elimination.' },
      witch: { name: 'Witch', team: 'village', stackable: false, desc: 'Has 1 heal potion and 1 poison potion for the entire match.' },
      avenger: { name: 'Avenger', team: 'village', stackable: false, desc: 'When you die, select another player to eliminate with you.' },
      seer_apprentice: { name: 'Seer apprentice', team: 'village', stackable: false, desc: 'Takes over as active Seer when the original Seer dies.' },
      pacifist: { name: 'Pacifist', team: 'village', stackable: false, desc: 'Once per game, reveal a player role and cancel daytime voting.' },
      priest: { name: 'Priest', team: 'village', stackable: false, desc: 'Once per game, splash holy water: if target is werewolf they die, otherwise you die.' },
      mayor: { name: 'Mayor', team: 'village', stackable: false, desc: 'Once revealed, your daytime vote counts as 2.' },
      bodyguard: { name: 'Bodyguard', team: 'village', stackable: false, desc: 'Protect one player each night. If attacked by wolves, you die in their place.' },
      detective: { name: 'Detective', team: 'village', stackable: false, desc: 'Each night, pick two players to see if they belong to the same team.' },
      wise_man: { name: 'Wise man', team: 'village', stackable: false, desc: 'Cannot be killed by werewolves during the night.' },
      aura_seer: { name: 'Aura seer', team: 'village', stackable: false, desc: 'Each night, inspect a player to see if they have a werewolf aura.' },
      handsome_prince: { name: 'Handsome prince', team: 'village', stackable: false, desc: 'The first time the village attempts to lynch you, you reveal your role and survive.' },
      sibling: { name: 'Sibling', team: 'village', stackable: true, desc: 'Knows the identities of other living Siblings.' },
      naughty_boy: { name: 'Naughty boy', team: 'village', stackable: false, desc: 'Once per game, swap the roles of two living players at night.' },
      red_lady: { name: 'Red lady', team: 'village', stackable: false, desc: 'Visit a player at night. If they are a werewolf or killed by one, you die. If wolves attack your empty bed, you survive.' },
      grumpy_grandma: { name: 'Grumpy grandma', team: 'village', stackable: false, desc: 'Each night, silence one player from voting during the following day.' },
      drunk: { name: 'Drunk', team: 'village', stackable: false, desc: 'Constantly drunk and may not speak during discussions.' },
      idiot: { name: 'Idiot', team: 'village', stackable: false, desc: 'If lynched by the village, you survive but permanently lose voting rights.' },
      gunner: { name: 'Gunner', team: 'village', stackable: false, desc: 'Holds 2 bullets. Can shoot someone by day; role is revealed upon first shot.' },
      vigilante: { name: 'Vigilante', team: 'village', stackable: false, desc: 'Has 1 bullet to kill, or can choose to inspect a role which disables voting that round.' },
      marksman: { name: 'Marksman', team: 'village', stackable: false, desc: 'Marks target at night; next day can kill. If target is innocent villager, marksman dies.' },
      beast_hunter: { name: 'Beast Hunter', team: 'village', stackable: false, desc: 'Places a delayed trap. If attacked by wolves the next night, the weakest wolf dies instead.' },
      tough_guy: { name: 'Tough guy', team: 'village', stackable: false, desc: 'If attacked at night, survives the night and dies at the end of the next day.' },
      mad_scientist: { name: 'Mad scientist', team: 'village', stackable: false, desc: 'When you die, your chemical explosion eliminates the adjacent seated players.' },
      medium: { name: 'Medium', team: 'village', stackable: false, desc: 'Once per game, revive one eliminated player back to life.' },
      president: { name: 'President', team: 'village', stackable: false, desc: 'Publicly known president. If the president dies, the entire village immediately loses.' },

      // WEREWOLF ALIGNED
      werewolf: { name: 'Werewolf', team: 'wolf', stackable: true, desc: 'Picks a victim together with fellow wolves each night.' },
      junior_werewolf: { name: 'Junior werewolf', team: 'wolf', stackable: false, desc: 'When killed, chooses one player to take down with them.' },
      lone_wolf: { name: 'Lone wolf', team: 'wolf', stackable: false, desc: 'Regular werewolf, but only wins if they are the last surviving werewolf.' },
      cursed_human: { name: 'Cursed Human', team: 'wolf', stackable: false, desc: 'Villager until attacked by werewolves, then converts into a full werewolf.' },
      kitten_wolf: { name: 'Kitten wolf', team: 'wolf', stackable: false, desc: 'Once per game, can bite a player to convert them into a werewolf instead of killing.' },
      sorcerer: { name: 'Sorcerer', team: 'wolf', stackable: false, desc: 'Each night, checks one player to see if they are the Seer or a Werewolf.' },
      wolf_seer: { name: 'Wolf seer', team: 'wolf', stackable: false, desc: 'Each night discovers exact role of a player. Becomes regular wolf if last wolf alive.' },
      alpha_werewolf: { name: 'Alpha Werewolf', team: 'wolf', stackable: false, desc: 'Regular werewolf whose vote counts as 2 during night selection.' },
      shadow_werewolf: { name: 'Shadow Werewolf', team: 'wolf', stackable: false, desc: 'Once per game, doubles wolf votes and obscures votes during daytime.' },
      nightmare_werewolf: { name: 'Nightmare Werewolf', team: 'wolf', stackable: false, desc: 'Twice per game, puts a player to sleep, disabling their abilities for the night.' },

      // SOLO / NEUTRAL
      fool: { name: 'Fool', team: 'solo', stackable: false, desc: 'Wins solely by getting lynched by the village during the day.' },
      headhunter: { name: 'Headhunter', team: 'solo', stackable: false, desc: 'Assigned a secret target. Wins if target gets lynched by the village.' },
      serial_killer: { name: 'Serial killer', team: 'solo', stackable: false, desc: 'Kills one player each night. Wins if last person standing.' },
      arsonist: { name: 'Arsonist', team: 'solo', stackable: false, desc: 'Douses 2 players per night or ignites all doused. Immune to wolf attacks. Wins if last alive.' },
      sect_leader: { name: 'Sect leader', team: 'solo', stackable: false, desc: 'Converts one player each night. Wins when all living players are in the sect.' },
      sect_hunter: { name: 'Sect hunter', team: 'village', stackable: false, desc: 'Selects a player each night; if they are Sect Leader or in the sect, they die.' },
      grave_robber: { name: 'Grave robber', team: 'solo', stackable: false, desc: 'Selects target on Night 1. If target dies, takes their role.' },
      cupid: { name: 'Cupid', team: 'solo', stackable: false, desc: 'On Night 1 binds two lovers. Lovers win if they are the final couple standing.' }
    };

    const roleToggles = {};
    Object.keys(ROLES).forEach(k => {
      roleToggles[k] = ['werewolf', 'villager', 'seer', 'doctor', 'witch', 'avenger', 'bodyguard', 'fool'].includes(k);
    });

    const state = {
      players: [],
      round: 1,
      phase: 'night',
      nightActions: {},
      votes: {},
      lovers: null,
      sect: [],
      doused: [],
      beastTrapped: null,
      activeTrap: null,
      asleep: null,
      timerId: null,
      log: [],
      settings: {
        firstNightImmunity: true,
        hideVoteCounts: true,
        dayTimer: 180
      }
    };

    const $ = id => document.getElementById(id);
    const switchScreen = name => {
      document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
      $(name).classList.add('active');
    };

    document.querySelectorAll('.tab-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        $(btn.dataset.tab).classList.add('active');
      });
    });

    $('assignmentMode').addEventListener('change', e => {
      const mode = e.target.value;
      if (mode === 'selected_random') {
        $('modeDesc').textContent = 'Toggle which roles are allowed. The game randomly determines if they appear and how many appear.';
        $('quickToggles').style.display = 'flex';
      } else if (mode === 'full_random') {
        $('modeDesc').textContent = 'All 40 roles are in the pool. Quantities and presence are completely randomized.';
        $('quickToggles').style.display = 'none';
      } else {
        $('modeDesc').textContent = 'Set specific counts manually for each role.';
        $('quickToggles').style.display = 'none';
      }
      renderRoleCards();
    });

    function renderRoleCards() {
      const mode = $('assignmentMode').value;
      const grid = $('roleGrid');
      grid.innerHTML = Object.entries(ROLES).map(([key, r]) => {
        let controls = '';
        if (mode === 'custom') {
          controls = `<input type="number" id="role_count_${key}" value="${key === 'werewolf' ? 2 : (key === 'seer' || key === 'doctor' ? 1 : 0)}" min="0" max="10" style="padding:0.3rem; margin:0; width:60px;">`;
        } else if (mode === 'selected_random') {
          const active = roleToggles[key];
          controls = `<button class="role-toggle-btn ${active ? 'active' : ''}" id="toggle_btn_${key}" onclick="toggleRole('${key}')">${active ? 'ENABLED' : 'OFF'}</button>`;
        } else {
          controls = `<span class="muted" style="font-size:0.75rem;">In Random Pool</span>`;
        }

        return `
          <div class="role-card team-${r.team}">
            <div>
              <strong>${r.name}</strong>
              <span class="role-badge badge-${r.team}">${r.team}</span>
            </div>
            <div class="role-action-bar">
              ${controls}
              <button class="secondary" style="width:auto; padding:0.3rem 0.5rem; margin:0;" onclick="showRoleInfo('${key}')">ℹ️</button>
            </div>
          </div>
        `;
      }).join('');
    }

    window.toggleRole = function(key) {
      roleToggles[key] = !roleToggles[key];
      const btn = $(`toggle_btn_${key}`);
      if (btn) {
        btn.className = `role-toggle-btn ${roleToggles[key] ? 'active' : ''}`;
        btn.textContent = roleToggles[key] ? 'ENABLED' : 'OFF';
      }
    };

    window.toggleAllRoles = function(enable) {
      Object.keys(ROLES).forEach(k => roleToggles[k] = enable);
      renderRoleCards();
    };

    window.showRoleInfo = function(key) {
      const r = ROLES[key];
      $('modalRoleName').textContent = r.name;
      $('modalTeamBadge').textContent = r.team.toUpperCase();
      $('modalTeamBadge').className = `role-badge badge-${r.team}`;
      $('modalRoleDesc').textContent = r.desc;
      $('infoModal').classList.add('active');
    };
    $('modalCloseBtn').onclick = () => $('infoModal').classList.remove('active');

    $('addPlayerBtn').addEventListener('click', addPlayer);
    $('playerName').addEventListener('keypress', e => { if (e.key === 'Enter') addPlayer(); });
    $('startBtn').addEventListener('click', assignRoles);
    $('beginNightBtn').addEventListener('click', runNightPhase);
    $('newGameBtn').addEventListener('click', () => location.reload());

    function addPlayer() {
      const name = $('playerName').value.trim();
      if (!name) return;
      if (state.players.some(p => p.name.toLowerCase() === name.toLowerCase())) return alert('Name already added.');
      state.players.push({
        id: Date.now() + Math.random(),
        name,
        role: null,
        alive: true,
        usedOneTime: false,
        bullets: 2,
        arrows: 2
      });
      $('playerName').value = '';
      renderPlayers();
    }

    window.removePlayer = function(id) {
      state.players = state.players.filter(p => p.id !== id);
      renderPlayers();
    };

    function renderPlayers() {
      $('playersList').innerHTML = state.players.map(p => `
        <li><span>${p.name}</span><button class="secondary" style="width:auto; padding:0.2rem 0.5rem;" onclick="removePlayer(${p.id})">Remove</button></li>
      `).join('');
      $('playerCount').textContent = state.players.length;
      $('startBtn').disabled = state.players.length < 4;
    }

    function alivePlayers() { return state.players.filter(p => p.alive); }
    function isWolf(role) { return ROLES[role]?.team === 'wolf'; }
    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function log(msg) {
      state.log.push(msg);
      $('gameLog').textContent = state.log.join('\n');
      $('gameLog').scrollTop = $('gameLog').scrollHeight;
    }

    function assignRoles() {
      const total = state.players.length;
      const mode = $('assignmentMode').value;
      const roles = [];

      state.settings.firstNightImmunity = $('firstNightImmunity').checked;
      state.settings.hideVoteCounts = $('hideVoteCounts').checked;
      state.settings.dayTimer = parseInt($('dayTimer').value) || 0;

      if (mode === 'custom') {
        Object.keys(ROLES).forEach(key => {
          const count = parseInt($(`role_count_${key}`)?.value) || 0;
          for (let i = 0; i < count; i++) roles.push(key);
        });
        if (roles.length > total) return alert('Assigned roles exceed total players!');
      } else if (mode === 'full_random') {
        const wolfCount = Math.max(1, Math.floor(total / 3.5));
        roles.push('werewolf');
        const wolfKeys = Object.keys(ROLES).filter(k => ROLES[k].team === 'wolf' && k !== 'werewolf');
        shuffle(wolfKeys);
        for (let i = 1; i < wolfCount; i++) roles.push(wolfKeys[i % wolfKeys.length]);

        const specialKeys = Object.keys(ROLES).filter(k => ROLES[k].team !== 'wolf' && k !== 'villager');
        shuffle(specialKeys);
        for (let i = 0; i < total - wolfCount && i < specialKeys.length; i++) {
          if (Math.random() > 0.3) roles.push(specialKeys[i]);
        }
      } else if (mode === 'selected_random') {
        const enabledKeys = Object.keys(ROLES).filter(k => roleToggles[k]);
        if (!enabledKeys.length) return alert('Please enable at least one role!');

        const enabledWolves = enabledKeys.filter(k => ROLES[k].team === 'wolf');
        const enabledNonWolves = enabledKeys.filter(k => ROLES[k].team !== 'wolf' && k !== 'villager');

        const targetWolves = Math.max(1, Math.floor(total / 3.5));
        for (let i = 0; i < targetWolves; i++) {
          if (enabledWolves.length > 0) {
            const picked = enabledWolves[Math.floor(Math.random() * enabledWolves.length)];
            roles.push(picked);
          } else {
            roles.push('werewolf');
          }
        }

        shuffle(enabledNonWolves);
        enabledNonWolves.forEach(k => {
          if (roles.length >= total) return;
          if (Math.random() < 0.65) {
            const r = ROLES[k];
            const qty = r.stackable ? Math.min(total - roles.length, Math.floor(Math.random() * 2) + 1) : 1;
            for (let q = 0; q < qty && roles.length < total; q++) {
              roles.push(k);
            }
          }
        });
      }

      while (roles.length < total) roles.push('villager');
      shuffle(roles);

      state.players.forEach((p, i) => {
        p.role = roles[i];
        p.alive = true;
        p.usedOneTime = false;
        p.bullets = 2;
        p.arrows = 2;
      });

      state.round = 1;
      state.lovers = null;
      state.sect = [];
      state.doused = [];
      state.log = [];

      renderRoleReveal();
    }

    function renderRoleReveal() {
      const grid = $('revealGrid');
      grid.innerHTML = state.players.map(p => `
        <button class="secondary role-reveal-btn" id="rev_btn_${p.id}" onclick="toggleReveal(${p.id})">${p.name}</button>
      `).join('');
      switchScreen('reveal');
    }

    window.toggleReveal = function(id) {
      const p = state.players.find(x => x.id === id);
      const btn = $(`rev_btn_${id}`);
      const r = ROLES[p.role];
      if (btn.classList.contains('revealed')) {
        btn.className = 'secondary role-reveal-btn';
        btn.textContent = p.name;
      } else {
        btn.className = `secondary role-reveal-btn revealed`;
        btn.innerHTML = `${p.name}<br><span class="role-badge badge-${r.team}">${r.name}</span>`;
      }
    };

    function runNightPhase() {
      state.phase = 'night';
      state.nightActions = { victim: null, poisonVictim: null, healed: null, protected: null, serialKill: null };
      state.activeTrap = state.beastTrapped;
      state.beastTrapped = null;
      $('phaseIndicator').textContent = `Night ${state.round}`;
      log(`\n=== Night ${state.round} Begins ===`);
      switchScreen('game');

      executeNightQueue();
    }

    function executeNightQueue() {
      if (state.round === 1 && alivePlayers().some(p => p.role === 'cupid') && !state.lovers) {
        return stepCupid();
      }
      stepWerewolves();
    }

    function stepCupid() {
      let html = `<h3>Cupid</h3><p class="muted center">Select two lovers:</p>`;
      html += `<select id="cupid1"><option value="">Lover 1...</option>${alivePlayers().map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
      html += `<select id="cupid2"><option value="">Lover 2...</option>${alivePlayers().map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
      html += `<button id="cupidConfirm" class="purple">Bind Lovers</button>`;
      $('gameContent').innerHTML = html;

      $('cupidConfirm').onclick = () => {
        const c1 = parseFloat($('cupid1').value);
        const c2 = parseFloat($('cupid2').value);
        if (c1 && c2 && c1 !== c2) {
          state.lovers = [c1, c2];
          log('Cupid bound two lovers.');
          stepWerewolves();
        }
      };
    }

    function stepWerewolves() {
      const wolves = alivePlayers().filter(p => isWolf(p.role));
      if (!wolves.length) return stepSpecials();

      let html = `<h3>Werewolf Pack</h3><p class="muted center">Wolves: ${wolves.map(p => p.name).join(', ')}</p>`;
      if (state.round === 1 && state.settings.firstNightImmunity) {
        html += `<p class="center" style="color:var(--solo)">First Night Kill Protection is enabled. No eliminations tonight.</p><button id="wolfNext" class="danger">Continue</button>`;
        $('gameContent').innerHTML = html;
        $('wolfNext').onclick = stepSpecials;
        return;
      }

      html += `<select id="wolfVictim"><option value="">Select Pack Victim...</option>${alivePlayers().filter(p => !isWolf(p.role)).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
      html += `<button id="wolfConfirm" class="danger">Confirm Pack Target</button>`;
      $('gameContent').innerHTML = html;

      $('wolfConfirm').onclick = () => {
        const v = parseFloat($('wolfVictim').value);
        if (v) state.nightActions.victim = v;
        stepSpecials();
      };
    }

    function stepSpecials() {
      const seer = alivePlayers().find(p => p.role === 'seer' || (p.role === 'seer_apprentice' && !alivePlayers().some(x => x.role === 'seer')));
      if (seer) {
        let html = `<h3>Seer (${seer.name})</h3><select id="seerTgt"><option value="">Inspect player...</option>${alivePlayers().filter(p => p.id !== seer.id).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
        html += `<div id="seerRes" class="center big" style="margin:0.5rem 0;"></div><button id="seerBtn">Inspect</button><button id="seerNext" class="secondary" style="display:none;">Next</button>`;
        $('gameContent').innerHTML = html;
        $('seerBtn').onclick = () => {
          const tgt = state.players.find(p => p.id === parseFloat($('seerTgt').value));
          if (!tgt) return;
          const isW = isWolf(tgt.role);
          $('seerRes').innerHTML = `${tgt.name} is ${isW ? '<span class="role-badge badge-wolf">A WEREWOLF</span>' : '<span class="role-badge badge-village">NOT A WEREWOLF</span>'}`;
          $('seerBtn').style.display = 'none';
          $('seerNext').style.display = 'block';
        };
        $('seerNext').onclick = stepDoctor;
        return;
      }
      stepDoctor();
    }

    function stepDoctor() {
      const doc = alivePlayers().find(p => p.role === 'doctor');
      if (doc) {
        let html = `<h3>Doctor (${doc.name})</h3><select id="docTgt"><option value="">Protect player...</option>${alivePlayers().map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
        html += `<button id="docBtn" class="success">Protect</button>`;
        $('gameContent').innerHTML = html;
        $('docBtn').onclick = () => {
          state.nightActions.protected = parseFloat($('docTgt').value);
          stepSerialKiller();
        };
        return;
      }
      stepSerialKiller();
    }

    function stepSerialKiller() {
      const sk = alivePlayers().find(p => p.role === 'serial_killer');
      if (sk) {
        let html = `<h3>Serial Killer (${sk.name})</h3><select id="skTgt"><option value="">Choose Victim...</option>${alivePlayers().filter(p => p.id !== sk.id).map(p => `<option value="${p.id}">${p.name}</option>`).join('')}</select>`;
        html += `<button id="skBtn" class="danger">Kill Target</button>`;
        $('gameContent').innerHTML = html;
        $('skBtn').onclick = () => {
          state.nightActions.serialKill = parseFloat($('skTgt').value);
          resolveNight();
        };
        return;
      }
      resolveNight();
    }

    function resolveNight() {
      const deadQueue = new Set();

      if (state.nightActions.victim) {
        const victim = state.players.find(p => p.id === state.nightActions.victim);
        if (victim && victim.role === 'cursed_human') {
          victim.role = 'werewolf';
          log(`Cursed Human was attacked and converted into a Werewolf!`);
        } else if (victim && victim.id === state.activeTrap) {
          log(`Beast Hunter trap triggered! Werewolf attack thwarted.`);
        } else if (victim && victim.role !== 'wise_man' && victim.id !== state.nightActions.protected) {
          deadQueue.add(victim.id);
        }
      }

      if (state.nightActions.serialKill) {
        deadQueue.add(state.nightActions.serialKill);
      }

      const killed = processCasualties(deadQueue);
      showMorning(killed);
    }

    function processCasualties(ids) {
      const queue = Array.from(ids);
      const dead = [];

      while (queue.length) {
        const id = queue.shift();
        const p = state.players.find(x => x.id === id);
        if (!p || !p.alive) continue;
        p.alive = false;
        dead.push(p);

        if (state.lovers && state.lovers.includes(id)) {
          const partnerId = state.lovers.find(x => x !== id);
          queue.push(partnerId);
        }

        if (p.role === 'president') {
          endGame('President died! Werewolves Win.');
          return dead;
        }
      }
      return dead;
    }

    function showMorning(killed) {
      if (checkWin()) return;
      let html = `<h3>Morning ${state.round}</h3>`;
      if (killed.length) {
        html += killed.map(p => `<p class="center"><strong>${p.name}</strong> died. (<span class="role-badge badge-${ROLES[p.role].team}">${ROLES[p.role].name}</span>)</p>`).join('');
      } else {
        html += `<p class="center">Peaceful night. No one died.</p>`;
      }
      html += `<button id="startDayBtn" class="success" style="margin-top:1rem;">Start Day ${state.round}</button>`;
      $('gameContent').innerHTML = html;

      $('startDayBtn').onclick = runDayPhase;
    }

    function runDayPhase() {
      state.phase = 'day';
      state.votes = {};
      $('phaseIndicator').textContent = `Day ${state.round}`;

      let currentSecs = state.settings.dayTimer;
      let html = `<h3>Day Discussion</h3>`;
      if (currentSecs > 0) {
        html += `<div class="big center" id="timerDisplay" style="color:var(--solo);">${Math.floor(currentSecs / 60)}:${(currentSecs % 60).toString().padStart(2, '0')}</div>`;
      }
      html += `<button id="openVoteBtn" class="purple">Proceed to Voting</button><div id="voteArea"></div>`;
      $('gameContent').innerHTML = html;

      if (currentSecs > 0) {
        clearInterval(state.timerId);
        state.timerId = setInterval(() => {
          currentSecs--;
          if ($('timerDisplay')) $('timerDisplay').textContent = `${Math.floor(currentSecs / 60)}:${(currentSecs % 60).toString().padStart(2, '0')}`;
          if (currentSecs <= 0) clearInterval(state.timerId);
        }, 1000);
      }

      $('openVoteBtn').onclick = renderVoteArea;
    }

    function renderVoteArea() {
      clearInterval(state.timerId);
      const alive = alivePlayers();
      const hideCounts = state.settings.hideVoteCounts;

      let html = `<h3>Village Vote</h3><p class="center muted">${Object.keys(state.votes).length}/${alive.length} votes cast</p><div class="grid-2">`;
      alive.forEach(p => {
        const count = Object.values(state.votes).filter(id => id === p.id).length;
        html += `<button class="secondary vote-btn" onclick="voteFor(${p.id})">${p.name}${hideCounts ? '' : ` (${count})`}</button>`;
      });
      html += `</div><button id="resolveVotesBtn" class="danger" style="margin-top:1rem;">Resolve Vote</button>`;
      $('gameContent').innerHTML = html;

      $('resolveVotesBtn').onclick = resolveDayVotes;
    }

    window.voteFor = function(targetId) {
      const name = prompt('Enter your name to cast vote:');
      const voter = state.players.find(p => p.name.toLowerCase() === (name || '').toLowerCase() && p.alive);
      if (voter) {
        state.votes[voter.id] = targetId;
        renderVoteArea();
      }
    };

    function resolveDayVotes() {
      const tally = {};
      Object.values(state.votes).forEach(id => tally[id] = (tally[id] || 0) + 1);

      let max = 0, tied = [];
      Object.entries(tally).forEach(([id, count]) => {
        if (count > max) { max = count; tied = [parseFloat(id)]; }
        else if (count === max) tied.push(parseFloat(id));
      });

      let html = `<h3>Vote Results</h3>`;
      if (tied.length === 1 && max > 0) {
        const elim = state.players.find(p => p.id === tied[0]);
        if (elim.role === 'fool') {
          return endGame(`Fool (${elim.name}) was lynched and wins the game!`);
        }
        if (elim.role === 'idiot' && !elim.usedOneTime) {
          elim.usedOneTime = true;
          html += `<p class="center"><strong>${elim.name}</strong> is the Idiot! Survives lynching but loses voting rights.</p>`;
        } else if (elim.role === 'handsome_prince' && !elim.usedOneTime) {
          elim.usedOneTime = true;
          html += `<p class="center"><strong>${elim.name}</strong> is the Handsome Prince! Revealed role and spared by village.</p>`;
        } else {
          processCasualties(new Set([elim.id]));
          html += `<p class="center"><strong>${elim.name}</strong> was lynched. (<span class="role-badge badge-${ROLES[elim.role].team}">${ROLES[elim.role].name}</span>)</p>`;
        }
      } else {
        html += `<p class="center">Tied or no votes. No one was lynched.</p>`;
      }

      html += `<button id="nightFallsBtn" class="danger" style="margin-top:1rem;">Night Falls</button>`;
      $('gameContent').innerHTML = html;

      $('nightFallsBtn').onclick = () => {
        state.round++;
        if (!checkWin()) runNightPhase();
      };
    }

    function checkWin() {
      const alive = alivePlayers();
      const wolves = alive.filter(p => isWolf(p.role)).length;
      const village = alive.filter(p => ROLES[p.role].team === 'village').length;
      const solos = alive.filter(p => ROLES[p.role].team === 'solo').length;

      if (wolves === 0 && solos === 0) return endGame('Villagers Win!');
      if (wolves >= (village + solos)) return endGame('Werewolves Win!');
      return false;
    }

    function endGame(msg) {
      clearInterval(state.timerId);
      switchScreen('end');
      $('winnerText').textContent = msg;
      $('finalRoles').innerHTML = state.players.map(p => `
        <p><strong>${p.name}</strong>: <span class="role-badge badge-${ROLES[p.role].team}">${ROLES[p.role].name}</span> ${p.alive ? '(survived)' : '(eliminated)'}</p>
      `).join('');
      return true;
    }

    renderRoleCards();
  </script>
</body>
</html>
